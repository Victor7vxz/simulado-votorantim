    ],

let current = 0;
let answers = Array(questions.length).fill(null);
let seconds = 0;

function render() {
  const q = questions[current];

  document.getElementById("counter").textContent =
    `Questão ${current+1}/40`;

  document.getElementById("subject").textContent = q.subject;
  document.getElementById("topic").textContent = q.topic;
  document.getElementById("question").textContent = q.q;

  document.getElementById("bar").style.width =
    ((current+1)/40*100)+"%";

  const options = document.getElementById("options");
  options.innerHTML = "";

  q.o.forEach((text,i) => {
    const label = document.createElement("label");
    label.className = "option";

    const input = document.createElement("input");
    input.type = "radio";
    input.name = "answer";
    input.checked = answers[current] === i;

    input.onchange = () => {
      answers[current] = i;
    };

    label.append(input, " "+String.fromCharCode(65+i)+") "+text);
    options.appendChild(label);
  });

  document.getElementById("next").textContent =
    current === 39 ? "Finalizar" : "Próxima";

  document.querySelector(".actions button:first-child").disabled =
    current === 0;
}

function next() {
  if (answers[current] === null) {
    alert("Escolha uma alternativa antes de continuar.");
    return;
  }

  if (current < 39) {
    current++;
    render();
  } else {
    finish();
  }
}

function previous() {
  if (current > 0) {
    current--;
    render();
  }
}

function finish() {
  if (answers.some(a => a === null)) {
    alert("Responda todas as questões antes de finalizar.");
    return;
  }

  const correct = questions.reduce(
    (total,q,i) => total + (answers[i] === q.a ? 1 : 0), 0
  );
  const percent = Math.round(correct / questions.length * 100);

  const subjects = {};
  questions.forEach((q,i) => {
    if (!subjects[q.subject]) {
      subjects[q.subject] = { correct: 0, total: 0 };
    }
    subjects[q.subject].total++;
    if (answers[i] === q.a) subjects[q.subject].correct++;
  });

  const attempt = {
    date: new Date().toISOString(),
    correct,
    total: questions.length,
    percent,
    seconds,
    subjects
  };

  let historyData = [];
  try {
    historyData = JSON.parse(localStorage.getItem("simuladoHistorico2") || "[]");
    if (!Array.isArray(historyData)) historyData = [];
  } catch (error) {
    historyData = [];
  }
  historyData.push(attempt);
  historyData = historyData.slice(-30);

  try {
    localStorage.setItem("simuladoHistorico2", JSON.stringify(historyData));
  } catch (error) {
    alert("Não foi possível salvar o histórico neste navegador. Verifique o espaço disponível ou as configurações de privacidade.");
  }

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("score").textContent = `${correct}/${questions.length}`;
  document.getElementById("summary").textContent =
    `Você acertou ${correct} e errou ${questions.length-correct}. Aproveitamento: ${percent}%.`;

  const stats = document.getElementById("subjectStats");
  stats.innerHTML = "<h3>Desempenho por matéria</h3>";
  Object.entries(subjects).forEach(([name,data]) => {
    const line = document.createElement("div");
    const subjectPercent = Math.round(data.correct / data.total * 100);
    line.textContent = `${name}: ${data.correct}/${data.total} (${subjectPercent}%)`;
    stats.appendChild(line);
  });

  const review = document.getElementById("review");
  review.innerHTML = "<h3>Gabarito comentado</h3>";

  questions.forEach((q,i) => {
    const item = document.createElement("div");
    const letter = String.fromCharCode(65+q.a);

    item.innerHTML = `
      <strong>Questão ${i+1}</strong>
      <p>Sua resposta: ${String.fromCharCode(65+answers[i])}</p>
      <p>Gabarito: ${letter}</p>
      <p>${q.e}</p>
      <strong>${answers[i]===q.a ? "Acertou" : "Errou"}</strong>
    `;

    review.appendChild(item);
  });

  const history = document.getElementById("history");
  history.innerHTML = "<h3>Histórico de tentativas</h3>";
  const previousAttempt = historyData.length > 1
    ? historyData[historyData.length - 2]
    : null;

  if (previousAttempt) {
    const difference = percent - previousAttempt.percent;
    const comparison = document.createElement("p");
    comparison.textContent = difference > 0
      ? `Você melhorou ${difference} pontos percentuais em relação à tentativa anterior.`
      : difference < 0
        ? `Seu resultado ficou ${Math.abs(difference)} pontos percentuais abaixo da tentativa anterior.`
        : "Você manteve o mesmo aproveitamento da tentativa anterior.";
    history.appendChild(comparison);
  } else {
    const first = document.createElement("p");
    first.textContent = "Esta foi sua primeira tentativa salva neste navegador.";
    history.appendChild(first);
  }

  historyData.slice().reverse().forEach((entry,index) => {
    const line = document.createElement("div");
    const date = new Date(entry.date).toLocaleString("pt-BR");
    line.textContent = `${date} — ${entry.correct}/${entry.total} (${entry.percent}%)`;
    history.appendChild(line);
  });

  window.scrollTo(0,0);
}

setInterval(() => {
  seconds++;
  const min = String(Math.floor(seconds/60)).padStart(2,"0");
  const sec = String(seconds%60).padStart(2,"0");
  document.getElementById("timer").textContent = min+":"+sec;
},1000);

render();
</script>
